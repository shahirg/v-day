<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Valentine?</title>

  <!-- 🔑 IMPORTANT FOR MOBILE -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Bootstrap CDN -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <style>
    body {
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .card {
      max-width: 740px;
      width: 92%;
      z-index: 2;
    }

    /* Question styling */
    .question-text {
      max-width: 100%;
      word-wrap: break-word;
      line-height: 1.25;
      text-align: center;
      font-size: clamp(1.4rem, 5vw, 1.9rem);
      font-weight: 500;
    }

    .name-line {
      font-size: clamp(1.8rem, 6vw, 2.4rem);
      font-weight: 600;
      color: #060606;
    }

    /* Password input */
    #passwordInput {
      font-size: 1.1rem;
      padding: 0.75rem;
    }

    /* Floating hearts */
    .heart {
      position: absolute;
      bottom: -20px;
      font-size: 24px;
      animation: floatUp linear forwards;
      opacity: 0.8;
      z-index: 1;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) scale(1);
        opacity: 0.9;
      }
      100% {
        transform: translateY(-120vh) scale(1.5);
        opacity: 0;
      }
    }

    /* Fade-in animations */
    .fade-name,
    .fade-question,
    .fade-buttons {
      opacity: 0;
    }

    .fade-name {
      animation: fadeUp 1s ease forwards;
    }

    .fade-question {
      animation: fadeUp 1s ease forwards;
      animation-delay: 0.8s;
    }

    .fade-buttons {
      animation: fadeUp 1s ease forwards;
      animation-delay: 1.8s;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Mobile tweaks */
    @media (max-width: 576px) {
      .card {
        padding: 1.25rem !important;
      }
    }
  </style>
</head>
<body>

<div class="card shadow p-4 text-center">

  <!-- Password Screen -->
  <div id="lockScreen">
    <h3 class="mb-3">🔒 Enter Password</h3>

    <input
      type="password"
      id="passwordInput"
      class="form-control mb-3"
      placeholder="Hint: Someone Cute 😊"
    >

    <button class="btn btn-primary w-100 py-3" onclick="checkPassword()">
      Unlock 💕
    </button>

    <p id="errorMsg" class="text-danger mt-2 d-none">
      Wrong password 😅
    </p>
  </div>

  <!-- Question Screen -->
  <div id="questionScreen" class="d-none">
    <div class="question-text mb-4">
      <div id="herName" class="name-line mb-2 fade-name"></div>
      <div class="fade-question">Will you be my Valentine? 💘</div>
    </div>

    <div class="fade-buttons">
      <div class="row justify-content-center g-3">
        <div class="col-12 col-sm-auto">
          <button class="btn btn-success btn-lg w-100 px-4 py-3" onclick="sayYes()">
            Yeahhh 💖
          </button>
        </div>
        <div class="col-12 col-sm-auto">
          <button class="btn btn-primary btn-lg w-100 px-4 py-3" onclick="sayYes()">
            MHMMM 🫣
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Thank You Screen -->
  <div id="thankYouScreen" class="d-none">
    <h1>Yay!!! 💞</h1>
    <p class="mt-3 fs-4">Thank you for being my Valentine ❤️</p>
  </div>

</div>

<script>
  const correctPassword = "Iya";
  const herNameValue = "Iya";

  function checkPassword() {
    const input = document.getElementById("passwordInput").value;
    const error = document.getElementById("errorMsg");

    if (input.toLowerCase() === correctPassword.toLowerCase()) {
      document.getElementById("herName").textContent = herNameValue;

      document.getElementById("lockScreen").classList.add("d-none");

      const questionScreen = document.getElementById("questionScreen");
      questionScreen.classList.remove("d-none");

      // Restart animations cleanly
      questionScreen.querySelectorAll(
        ".fade-name, .fade-question, .fade-buttons"
      ).forEach(el => {
        el.style.animation = "none";
        el.offsetHeight;
        el.style.animation = "";
      });

      startHearts();
    } else {
      error.classList.remove("d-none");
    }
  }

  function sayYes() {
    document.getElementById("questionScreen").classList.add("d-none");
    document.getElementById("thankYouScreen").classList.remove("d-none");
  }

  /* Floating hearts generator */
  function startHearts() {
    setInterval(() => {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.innerHTML = "💖";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDuration = (3 + Math.random() * 3) + "s";
      document.body.appendChild(heart);

      setTimeout(() => heart.remove(), 6000);
    }, 400);
  }
</script>

</body>
</html>
